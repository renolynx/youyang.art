<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容台 · Youyang Yu</title><link rel="stylesheet" href="/assets/css/fonts.css"><link rel="stylesheet" href="/desk.css"><script src="/desk.js" defer></script></head><body>
<aside class="rail"><a class="signature" href="#library" aria-label="内容库首页">yyy<span>CONTENT STUDIO</span></a><nav aria-label="内容台导航"><button data-view="all" class="active">▦ <span>内容库</span></button><button data-view="project">◈ <span>作品与实践</span></button><button data-view="editorial">☷ <span>网站页面</span></button><button id="all-media">▧ <span>素材库</span></button></nav><div class="rail-bottom"><a href="/site/" target="_blank">打开网站预览 ↗</a><button id="history">草稿历史</button><button id="reload-source">载入最新正本</button><p>一个条目，多处呈现。<br>慢慢把你的世界整理好。</p></div></aside>
<div class="workspace"><header class="top"><div class="breadcrumb">youyang.art <span>/</span> <strong id="location">内容库</strong></div><div class="save-state"><span class="dot"></span><span id="dirty" aria-live="polite">读取中</span></div><button id="save">保存草稿</button><button id="publish" class="primary">检查与发布 ↗</button></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="library"><div class="library-heading"><div><p class="eyebrow">YOUR LIVING COLLECTION</p><h1>正在生长的作品与生活。</h1><p class="intro">作品、文字、共同经历，都从这里继续。</p></div><button id="new" class="primary">＋ 新建内容</button></div><div class="library-tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="找标题、年份，或内容里的一个词…" aria-label="搜索内容库"></label><span id="library-count"></span><div class="view-switch" aria-label="呈现方式"><button id="grid-view" aria-pressed="true" aria-label="卡片视图">▦</button><button id="list-view" aria-pressed="false" aria-label="列表视图">☷</button></div></div><div class="filter-row"><button data-kind="all" aria-pressed="true">全部内容</button><button data-kind="project" aria-pressed="false">作品与实践</button><button data-kind="editorial" aria-pressed="false">网站页面</button><button data-kind="gallery" aria-pressed="false">旧站画廊</button></div><div id="library-cards" class="library-grid"></div></section>
<section id="editor" hidden><div class="editor-bar"><button id="back">← 内容库</button><span id="editing-title"></span><a id="preview-link" target="_blank">另窗预览 ↗</a></div><div class="editor-layout"><main id="main"></main><aside class="preview-panel"><div class="preview-toolbar"><span>页面预览 <small id="preview-state"></small></span><div><button id="preview-wide" aria-pressed="true">适应栏宽</button><button id="preview-narrow" aria-pressed="false">手机</button></div></div><div class="preview-canvas"><iframe id="preview-frame" title="当前页面的真实预览" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe></div></aside></div></section>
</div>
<dialog id="media-dialog" class="media-dialog"><div class="dialog-header"><div><p class="eyebrow">IMAGE LIBRARY</p><h2>让照片再次派上用场。</h2></div><button data-close="media-dialog" aria-label="关闭素材库">×</button></div><div class="media-tools"><input type="search" id="media-search" placeholder="搜索图片名称…" aria-label="搜索素材"><label class="upload-button">＋ 上传照片<input id="media-upload" type="file" accept="image/*" multiple></label></div><p id="media-help" class="hint"></p><div id="media-grid"></div></dialog>
<dialog id="dlg"><div class="dialog-header"><h2 id="dlg-title"></h2><button data-close="dlg" aria-label="关闭对话框">×</button></div><div id="dlg-body"></div><div id="dlg-actions" class="rowbtns"></div></dialog>
<div id="fatal" hidden></div>
</body></html>
